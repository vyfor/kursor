[package]
name = "kursor"
authors.workspace = true
categories.workspace = true
description = "A modern retained-mode TUI library with fine-grained reactivity"
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["lib"]

[features]
default = ["crossterm"]
crossterm = ["dep:crossterm"]
animate = ["kursor-core/animate", "dep:animate"]

[dependencies]
kursor-core = { version = "0.0.1", path = "../core" }
unicode-width = "0.2"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"], optional = true }
animate = { version = "0.5", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"], optional = true }
